name: AKBW CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'akbw-main/client/**'
      - 'akbw-main/server/**'
      - 'akbw-main/admin/**'
      - 'akbw-main/bot/**'
      - 'akbw-design/shop-bot/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Tekshiruv (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, server]
    defaults:
      run:
        working-directory: akbw-main/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: akbw-main/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prisma sxemasi
        if: matrix.app == 'server'
        run: npx prisma validate && npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: Xavfsizlik testlari
        if: matrix.app == 'server'
        run: npm test
      - name: Zaxira skriptlari sintaksisi
        if: matrix.app == 'server'
        working-directory: deploy/backup
        run: for f in *.sh; do sh -n "$f"; done

  deploy:
    name: Serverga chiqarish
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: SSH sozlash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Kodni serverga yuborish (rsync)
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' --exclude 'node_modules' --exclude '.next' \
            --exclude 'uploads' --exclude 'tsconfig.tsbuildinfo' \
            -R akbw-main/client akbw-main/server akbw-main/admin akbw-main/bot \
               akbw-design/shop-bot deploy \
            "deploy@${HOST}:/opt/akbw/"

      - name: Build va ishga tushirish
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: ssh "deploy@${HOST}" 'bash /opt/akbw/deploy/deploy.sh'
