name: akbw

services:
  db:
    image: postgres:15
    container_name: akbw-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida berilishi kerak}
      - POSTGRES_DB=akbw
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    networks:
      - akbw-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: akbw-server
    ports:
      - "8000:3000"
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
      - ./server/ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
      - server_logs:/app/logs
      - postgres_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - akbw-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: hst-bot
    ports:
      - "7000:7000"
volumes:
  postgres_data:
  uploads_data:
  server_logs:
  postgres_backups:

networks:
  akbw-network:
    driver: bridge
