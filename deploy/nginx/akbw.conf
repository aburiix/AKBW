# AKBW — Nginx (server: /etc/nginx/sites-available/akbw.conf)
# SSL qatorlarini certbot o'zi qo'shadi: certbot --nginx -d akbw.uz -d www.akbw.uz -d api.akbw.uz -d admin.akbw.uz

# Uzun domen nomlari (sslip.io) uchun
server_names_hash_bucket_size 128;

# Umumiy so'rov chegarasi (DDoS/brute-force'ga qarshi yengil himoya)
limit_req_zone $binary_remote_addr zone=akbw_api:10m rate=20r/s;
# Kirish va SMS: bitta IP - daqiqada 6 ta so'rov (parol/kodni taxmin qilishga qarshi)
limit_req_zone $binary_remote_addr zone=akbw_login:10m rate=6r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Asosiy sayt ----
server {
    listen 80;
    listen [::]:80;
    server_name akbw.uz www.akbw.uz;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ---- API ----
server {
    listen 80;
    listen [::]:80;
    server_name api.akbw.uz;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/api/(admin/login|factory/auth/login|sms/send|sms/verify)$ {
        limit_req zone=akbw_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=akbw_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ---- Admin panel ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.akbw.uz;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# IP yoki noma'lum domen orqali kelgan so'rovlarni yopish
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ---- Sinov manzili (DNS akbw.uz ga o'tguncha): 45-138-159-81.sslip.io ----
server {
    listen 80;
    listen [::]:80;
    server_name 45-138-159-81.sslip.io;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/api/(admin/login|factory/auth/login|sms/send|sms/verify)$ {
        limit_req zone=akbw_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|uploads)/ {
        limit_req zone=akbw_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.45-138-159-81.sslip.io;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
